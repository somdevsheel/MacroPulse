[project]
name = "macropulse"
version = "0.1.0"
description = "Macroeconomic news-driven market reaction research and prediction platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "polars>=2.1.0",
    "duckdb>=2.0.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (needs keys/network); run with -m live",
    "postgres: needs DATABASE_URL pointing at a real PostgreSQL",
]
addopts = "-m 'not live and not postgres'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
